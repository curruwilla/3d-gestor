<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custo de Impressão 3D</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --fg: #1d2129; --muted: #6b7280; --line: #e3e5e9;
    --accent: #e8590c; --accent-fg: #fff; --ok: #2b8a3e; --danger: #c92a2a; --input: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1d2026; --fg: #e8eaed; --muted: #9aa0a6; --line: #2e323a;
      --accent: #ff7a2f; --accent-fg: #14161a; --ok: #51cf66; --danger: #ff6b6b; --input: #24282f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 16px 4px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: 1fr 340px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  fieldset { border: 0; padding: 0; margin: 0 0 18px; }
  legend { font-weight: 600; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
  .tag { font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; }
  .row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  label { display: block; font-size: 13px; color: var(--muted); }
  .inp { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--input); margin-top: 4px; }
  .inp:focus-within { border-color: var(--accent); }
  .inp span { padding: 0 8px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); padding: 9px 8px; font: inherit; outline: none; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 7px; padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .res dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; }
  .res dt { color: var(--muted); }
  .res dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .res .sep { grid-column: 1 / -1; border-top: 1px solid var(--line); margin: 4px 0; }
  .final { margin-top: 14px; padding: 14px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 12%, transparent); text-align: center; }
  .final small { display: block; color: var(--muted); }
  .final strong { font-size: 30px; font-variant-numeric: tabular-nums; }
  .save { margin-top: 14px; display: grid; gap: 8px; }
  .hist { grid-column: 1 / -1; }
  .hist-top { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
  .hist-top .inp { margin: 0; min-width: 220px; }
  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.n, th.n { text-align: right; }
  tr:hover td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
  td .link { border: 0; padding: 2px 6px; color: var(--accent); background: none; }
  td .del { border: 0; padding: 2px 6px; color: var(--danger); background: none; }
  .empty { color: var(--muted); text-align: center; padding: 20px; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Custo de Impressão 3D</h1>
  <p>Campos marcados <span class="tag">padrão</span> podem ser salvos e voltam preenchidos.</p>
</header>

<main>
  <form class="card" id="form" autocomplete="off">
    <h2>Dados</h2>
    <fieldset>
      <legend>Filamento <span class="tag">padrão</span></legend>
      <div class="row">
        <label>Preço do kg<div class="inp"><span>R$</span><input name="preco_kg" inputmode="decimal" required></div></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Fatiador</legend>
      <div class="row">
        <label>Material usado<div class="inp"><input name="gramas" inputmode="decimal" required><span>g</span></div></label>
        <label>Horas<div class="inp"><input name="horas" inputmode="numeric" value="0"><span>h</span></div></label>
        <label>Minutos<div class="inp"><input name="minutos" inputmode="numeric" value="0"><span>min</span></div></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Energia <span class="tag">padrão</span></legend>
      <div class="row">
        <label>Tarifa da distribuidora<div class="inp"><span>R$</span><input name="tarifa_kwh" inputmode="decimal" required><span>/kWh</span></div></label>
        <label>Consumo médio da impressora<div class="inp"><input name="consumo_w" inputmode="decimal" required><span>W</span></div></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Lucro <span class="tag">padrão</span></legend>
      <div class="row">
        <label>Margem sobre o custo<div class="inp"><input name="margem" inputmode="decimal" required><span>%</span></div></label>
      </div>
    </fieldset>
    <div class="actions">
      <button type="button" id="btnSalvarPadrao">Salvar padrões</button>
      <button type="button" id="btnLimpar">Limpar fatiador</button>
    </div>
  </form>

  <section class="card res">
    <h2>Resultado</h2>
    <dl>
      <dt>Material</dt><dd id="r_material">—</dd>
      <dt>Energia <small id="r_kwh"></small></dt><dd id="r_energia">—</dd>
      <div class="sep"></div>
      <dt>Custo total</dt><dd id="r_custo">—</dd>
      <dt>Lucro</dt><dd id="r_lucro">—</dd>
    </dl>
    <div class="final"><small>Preço de venda</small><strong id="r_final">—</strong></div>
    <div class="save">
      <label>Nome da peça / cliente<div class="inp"><input id="nome" placeholder="ex: Suporte headset – João" maxlength="200"></div></label>
      <button class="primary" type="button" id="btnSalvar">Salvar no histórico</button>
    </div>
  </section>

  <section class="card hist">
    <div class="hist-top">
      <h2 style="margin:0">Histórico</h2>
      <div class="inp"><input id="busca" placeholder="Buscar por nome…"></div>
    </div>
    <div class="tbl">
      <table>
        <thead><tr>
          <th>Data</th><th>Nome</th><th class="n">Gramas</th><th class="n">Tempo</th>
          <th class="n">Custo</th><th class="n">Margem</th><th class="n">Preço</th><th></th>
        </tr></thead>
        <tbody id="hist"></tbody>
      </table>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const form = $('#form');
const F = n => form.elements[n];
const PADRAO = ['preco_kg', 'tarifa_kwh', 'consumo_w', 'margem'];
const CAMPOS = ['preco_kg', 'gramas', 'horas', 'minutos', 'tarifa_kwh', 'consumo_w', 'margem'];
const brl = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmt = v => Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 3 });
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : NaN; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200); }

async function api(url, opts = {}) {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const j = await r.json();
  if (!r.ok) throw new Error(j.erro || 'Erro');
  return j;
}

function valores() {
  const d = {};
  for (const c of CAMPOS) d[c] = F(c).value || (c === 'horas' || c === 'minutos' ? '0' : '');
  return d;
}

// Cálculo local (mesma fórmula do servidor) para atualizar enquanto digita.
function calcular() {
  const d = Object.fromEntries(Object.entries(valores()).map(([k, v]) => [k, num(v)]));
  if (Object.values(d).some(v => isNaN(v) || v < 0)) {
    ['r_material', 'r_energia', 'r_custo', 'r_lucro', 'r_final'].forEach(id => $('#' + id).textContent = '—');
    $('#r_kwh').textContent = '';
    return;
  }
  const h = Math.trunc(d.horas) + Math.trunc(d.minutos) / 60;
  const kwh = d.consumo_w / 1000 * h;
  const mat = d.gramas / 1000 * d.preco_kg;
  const ene = kwh * d.tarifa_kwh;
  const custo = mat + ene;
  const lucro = custo * d.margem / 100;
  $('#r_material').textContent = brl(mat);
  $('#r_energia').textContent = brl(ene);
  $('#r_kwh').textContent = `(${fmt(kwh)} kWh)`;
  $('#r_custo').textContent = brl(custo);
  $('#r_lucro').textContent = brl(lucro);
  $('#r_final').textContent = brl(custo + lucro);
}

async function carregarConfig() {
  const cfg = await api('/api/config');
  for (const k of PADRAO) F(k).value = String(cfg[k]).replace('.', ',');
  calcular();
}

async function salvarPadrao() {
  const body = {};
  for (const k of PADRAO) body[k] = F(k).value;
  try { await api('/api/config', { method: 'PUT', body: JSON.stringify(body) }); toast('Padrões salvos'); }
  catch (e) { toast(e.message); }
}

async function salvarHistorico() {
  const nome = $('#nome').value.trim();
  if (!nome) { $('#nome').focus(); return toast('Informe um nome'); }
  try {
    await api('/api/historico', { method: 'POST', body: JSON.stringify({ ...valores(), nome }) });
    toast('Salvo no histórico');
    $('#nome').value = '';
    carregarHistorico();
  } catch (e) { toast(e.message); }
}

let HIST = [];
async function carregarHistorico() {
  const q = encodeURIComponent($('#busca').value.trim());
  HIST = await api('/api/historico?q=' + q);
  const tb = $('#hist');
  if (!HIST.length) { tb.innerHTML = '<tr><td colspan="8" class="empty">Nenhum cálculo salvo.</td></tr>'; return; }
  tb.innerHTML = HIST.map(r => `<tr>
    <td>${new Date(r.criado_em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}</td>
    <td>${esc(r.nome)}</td>
    <td class="n">${fmt(r.gramas)} g</td>
    <td class="n">${r.horas}h${String(r.minutos).padStart(2, '0')}</td>
    <td class="n">${brl(r.custo_total)}</td>
    <td class="n">${fmt(r.margem)}%</td>
    <td class="n"><strong>${brl(r.preco_final)}</strong></td>
    <td><button class="link" data-load="${r.id}" title="Carregar no formulário">abrir</button><button class="del" data-del="${r.id}" title="Excluir">✕</button></td>
  </tr>`).join('');
}

$('#hist').addEventListener('click', async e => {
  const load = e.target.dataset.load, del = e.target.dataset.del;
  if (load) {
    const r = HIST.find(x => x.id == load);
    for (const c of CAMPOS) F(c).value = String(r[c]).replace('.', ',');
    $('#nome').value = r.nome;
    calcular();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (del) {
    const r = HIST.find(x => x.id == del);
    if (!confirm(`Excluir "${r.nome}"?`)) return;
    await api('/api/historico/' + del, { method: 'DELETE' });
    carregarHistorico();
  }
});

let buscaT;
$('#busca').addEventListener('input', () => { clearTimeout(buscaT); buscaT = setTimeout(carregarHistorico, 250); });
form.addEventListener('input', calcular);
form.addEventListener('submit', e => e.preventDefault());
$('#btnSalvarPadrao').onclick = salvarPadrao;
$('#btnSalvar').onclick = salvarHistorico;
$('#btnLimpar').onclick = () => { F('gramas').value = ''; F('horas').value = '0'; F('minutos').value = '0'; $('#nome').value = ''; calcular(); F('gramas').focus(); };
$('#nome').addEventListener('keydown', e => { if (e.key === 'Enter') salvarHistorico(); });

carregarConfig();
carregarHistorico();
</script>
</body>
</html>
